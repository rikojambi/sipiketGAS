<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f3a" />
    <title>SIPIKET - Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #1c2b3d; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 1rem; }
      .box { max-width: 420px; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(11,31,58,.08); }
      h1 { color: #0b1f3a; font-size: 1.4rem; }
      p { color: #65758a; }
      button { min-height: 44px; padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #0b1f3a; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Anda sedang offline</h1>
      <p>Data yang sudah disimpan tetap aman di perangkat. Transaksi akan dikirim otomatis ketika koneksi kembali.</p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
